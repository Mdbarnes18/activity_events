<!DOCTYPE html>
<html lang="en">

<head>

    <!--
    ========================================
    jQuery Selectors and Events Activity
    Name: Michael Barnes
    Date: September 19, 2026
    ========================================
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <!-- Link for CSS styles -->
    <link rel="stylesheet" href="./styles/main.css" type="text/css" />

    <!-- jQuery Library -->
    <script src="./resources/jquery.min.js"></script>

    <!-- Fallback to CDN if local jQuery fails -->
    <script>
        if (typeof jQuery === "undefined") {

            console.log("Local jQuery failed. Loading CDN version.");

            document.write(
                '<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>'
            );

        } else {

            console.log("Local jQuery loaded successfully.");

        }
    </script>

    <!-- jQuery Validation Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js"></script>

    <!-- Custom script -->
    <script src="./scripts/main.js"></script>

</head>

<body>

    <header>

        <h1>Contact Form</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>Send Us a Message</h2>

            <form id="feedback_form">

                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject">

                <label for="message">Message</label>
                <textarea id="message" name="message"></textarea>

                <button id="submitButton" type="submit">
                    Submit
                </button>

            </form>

            <div class="form_errors"></div>

            <p id="formResult"></p>

        </section>

    </main>

    <footer>

        <p>&copy; Michael Barnes 2026</p>

    </footer>

</body>

</html>
